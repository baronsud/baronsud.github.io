<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baronsud Mobile</title>
    
    <link rel="icon" href="logo-bsud.jpg" type="image/jpeg">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        /* RESET & VARIAVEIS */
        * { box-sizing: border-box; }

        :root {
            /* PALETA CYBER DIGITAL */
            --bg-color: #050510;       /* Roxo quase preto */
            --card-bg: #121225;        /* Roxo Digital Escuro */
            --text-color: #e0f2fe;     /* Branco Gelo */
            --accent-color: #00f3ff;   /* Azul Elétrico */
            --secondary-color: #d946ef; /* Roxo Neon */
            --gold-color: #facc15;     /* Amarelo Elétrico */
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow-x: hidden;
            width: 100%;
        }

        /* --- ESTILOS GERAIS --- */
        .lang-switcher {
            margin-top: 1.5rem;
            padding: 0.4rem;
            background: rgba(0, 243, 255, 0.05);
            border-radius: 50px;
            display: flex;
            gap: 5px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.1);
        }
        .lang-btn {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            padding: 6px 12px;
            font-size: 0.7rem;
            opacity: 0.6;
            transition: 0.3s;
            border-radius: 50px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
        }
        .lang-btn.active { 
            opacity: 1; 
            background: var(--accent-color); 
            color: #050510; 
            font-weight: 800; 
            box-shadow: 0 0 10px var(--accent-color);
        }

        .container { 
            width: fit-content; 
            min-width: 300px; 
            max-width: 90%; 
            padding: 2rem 1rem; 
            margin: auto; 
        }

        .logo-container { 
            margin-bottom: 0.5rem; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-img {
            width: 80px; 
            height: auto;
            border-radius: 50%; 
            border: 2px solid var(--accent-color);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            margin-bottom: 10px;
        }

        .logo-main { 
            font-size: 3.5rem; 
            font-weight: 800; 
            line-height: 0.9; 
            margin: 0; 
            color: var(--text-color);
            letter-spacing: -2px; 
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(224, 242, 254, 0.2);
        }
        .logo-sub { 
            font-size: 2rem; 
            font-weight: 300; 
            line-height: 1; 
            margin: 0; 
            opacity: 0.9; 
            letter-spacing: 4px; 
            text-transform: uppercase; 
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
        }

        .slogan {
            font-size: 0.9rem;
            letter-spacing: 1px;
            color: var(--secondary-color);
            opacity: 0.9;
            margin-top: 0.5rem;
            margin-bottom: 2rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* --- VIBE SECTION (CAPIVARA) --- */
        .vibe-container {
            margin-bottom: 3rem;
            position: relative;
        }
        .vibe-img {
            width: 100%;
            max-width: 500px; /* Limite para não ficar gigante */
            border-radius: 15px;
            border: 1px solid rgba(217, 70, 239, 0.3); /* Borda roxa sutil */
            opacity: 0.8;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            transition: 0.3s;
        }
        .vibe-img:hover {
            opacity: 1;
            box-shadow: 0 0 20px rgba(217, 70, 239, 0.2);
        }

        /* --- PROJECT CARD --- */
        .project-card { 
            background: var(--card-bg); 
            padding: 0; 
            border-radius: 20px; 
            box-shadow: 0 0 30px rgba(188, 19, 254, 0.15); 
            border: 1px solid rgba(0, 243, 255, 0.1); 
            text-align: center;
            width: 100%; 
            overflow: hidden; 
            position: relative;
        }
        
        .card-content { padding: 2.5rem 2rem; }

        .feature-img {
            width: 100%;
            height: auto;
            display: block;
            border-bottom: 1px solid rgba(0, 243, 255, 0.1);
        }

        .badge { 
            background: var(--gold-color); 
            color: #050510; 
            padding: 0.3rem 1rem; 
            border-radius: 50px; 
            font-weight: 800; 
            font-size: 0.7rem; 
            text-transform: uppercase; 
            display: inline-block;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        }

        h3 { 
            font-size: 2rem; 
            margin-top: 1.5rem; 
            margin-bottom: 1rem; 
            color: #fff;
            text-shadow: 0 0 5px rgba(255,255,255,0.3);
        }

        .feature-list { 
            list-style: none; 
            padding: 0; 
            margin: 1.5rem auto; 
            display: inline-block; 
            text-align: left; 
        }
        .feature-list li { 
            margin-bottom: 12px; 
            font-size: 1rem; 
            opacity: 0.9; 
            display: flex; 
            align-items: flex-start; 
        }
        .feature-list li::before { 
            content: '>'; 
            color: var(--secondary-color); 
            font-weight: bold; 
            margin-right: 12px; 
            flex-shrink: 0;
            text-shadow: 0 0 5px var(--secondary-color);
        }

        .footer { 
            margin-top: 4rem; 
            font-size: 0.8rem; 
            opacity: 0.6; 
            padding-bottom: 2rem; 
            line-height: 1.6;
            color: #a7f3d0;
        }
        a { color: var(--accent-color); text-decoration: none; font-weight: bold; transition: 0.3s; }
        a:hover { color: var(--secondary-color); text-shadow: 0 0 8px var(--secondary-color); }

        @media (max-width: 600px) {
            .logo-main { font-size: 2.8rem; }
            .logo-sub { font-size: 1.8rem; }
            .card-content { padding: 2rem 1rem; }
            h3 { font-size: 1.6rem; }
            .feature-list li { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <div class="lang-switcher">
        <button class="lang-btn" onclick="setLanguage('en')" id="btn-en">EN</button>
        <button class="lang-btn" onclick="setLanguage('pt')" id="btn-pt">PT</button>
    </div>

    <div class="container">
        <div class="logo-container">
            <img src="logo-bsud.jpg" alt="Baronsud Logo" class="logo-img">
            <p class="logo-main">BARONSUD</p>
            <p class="logo-sub">MOBILE</p>
        </div>
        
        <p class="slogan">Simplicity is timeless.</p>

        <div class="vibe-container">
            <img src="capivaraunicornio.jpg" alt="Dev Vibe" class="vibe-img">
        </div>

        <div class="project-card">
            <img src="memorizeart.jpg" alt="Memorize Art Screenshot" class="feature-img">
            
            <div class="card-content">
                <div><span id="badge" class="badge">Latest Release</span></div>
                <h3>Memorize Art</h3>
                
                <ul class="feature-list" id="description-list">
                    </ul>

                <p id="status" style="font-size: 0.9rem; margin-top: 30px; color: var(--accent-color); font-weight: 500; text-shadow: 0 0 5px rgba(0, 243, 255, 0.3);">
                    </p>
            </div>
        </div>

        <div class="footer">
            &copy; 2026 Baronsud Mobile. All rights reserved.<br>
            Contact: <a href="mailto:baronsud@proton.me">baronsud@proton.me</a> | 
            <a href="privacy.html">Privacy Policy</a>
        </div>
    </div>

    <script>
        const translations = {
            'pt': { 
                badge: "Lançamento", 
                features: [
                    "Desafio de memória para amantes da arte.",
                    "10 idiomas, 8 temas.",
                    "Design minimalista e eficiente.",
                    "Sem distrações desnecessárias."
                ],
                status: "Em breve na Google Play Store."
            },
            'en': { 
                badge: "Latest Release", 
                features: [
                    "Memory challenge for art lovers.",
                    "10 languages, 8 themes.",
                    "Minimalist and efficient design.",
                    "No unnecessary distractions."
                ],
                status: "Coming soon to Google Play Store."
            }
        };

        function setLanguage(lang) {
            document.getElementById('badge').innerText = translations[lang].badge;
            document.getElementById('status').innerHTML = `<i>${translations[lang].status}</i>`;

            const listContainer = document.getElementById('description-list');
            listContainer.innerHTML = '';
            translations[lang].features.forEach(text => {
                const li = document.createElement('li');
                li.innerText = text;
                listContainer.appendChild(li);
            });

            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
        }

        // Default to English
        setLanguage('en');
    </script>
</body>
</html>
